<svg width="120" height="120" viewBox="0 0 120 120"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <clipPath id="waterClip">
      <rect x="10" y="20" width="100" height="90" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="100" height="100"
        rx="20" fill="#e0f2fe"/>

  <!-- Rising flood water -->
  <g clip-path="url(#waterClip)">
    <path d="M0 78
             C15 68, 25 88, 40 78
             S65 68, 80 78
             S105 88, 125 75
             L125 120 L0 120 Z"
          fill="url(#waterGradient)">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -12 3; 0 0"
        dur="3s"
        repeatCount="indefinite"/>
    </path>

    <!-- Second wave -->
    <path d="M0 91
             C15 82, 25 100, 40 91
             S65 82, 80 91
             S105 100, 125 88
             L125 120 L0 120 Z"
          fill="#0369a1"
          opacity="0.55">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 10 0; 0 0"
        dur="2.2s"
        repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Flood warning triangle -->
  <g>
    <path d="M60 28 L78 59 H42 Z"
          fill="#fbbf24"
          stroke="#92400e"
          stroke-width="3"
          stroke-linejoin="round"/>

    <line x1="60" y1="38" x2="60" y2="48"
          stroke="#7c2d12"
          stroke-width="4"
          stroke-linecap="round"/>

    <circle cx="60" cy="54" r="2"
            fill="#7c2d12"/>

    <!-- Floating animation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -5; 0 0"
      dur="1.8s"
      repeatCount="indefinite"/>
  </g>

</svg>