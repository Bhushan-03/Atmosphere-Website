<svg width="120" height="120" viewBox="0 0 120 120"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="electricGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="104" height="104"
        rx="25" fill="#172554"/>

  <!-- Storm cloud -->
  <path d="M25 52
           C25 42 33 35 43 35
           C49 25 64 24 72 34
           C82 32 94 39 94 50
           C94 57 89 62 82 63
           H34
           C28 63 23 58 25 52Z"
        fill="#334155">

    <animate
      attributeName="fill"
      values="#334155;#475569;#334155"
      dur="2s"
      repeatCount="indefinite"/>
  </path>

  <!-- Lightning glow -->
  <path d="M59 45
           L43 70
           H57
           L50 94
           L78 62
           H63
           Z"
        fill="#facc15"
        opacity="0.35"
        filter="url(#electricGlow)">

    <animate
      attributeName="opacity"
      values="0.2;0.8;0.2;0.1;0.9;0.2"
      dur="1.8s"
      repeatCount="indefinite"/>
  </path>

  <!-- Main lightning bolt -->
  <path d="M59 45
           L43 70
           H57
           L50 94
           L78 62
           H63
           Z"
        fill="url(#bolt)"
        stroke="#fde047"
        stroke-width="2"
        stroke-linejoin="round">

    <!-- Lightning flash -->
    <animate
      attributeName="opacity"
      values="1;1;0.2;1;0.4;1"
      dur="1.8s"
      repeatCount="indefinite"/>
  </path>

  <!-- Electric sparks -->
  <g fill="#fef08a">

    <circle cx="34" cy="72" r="2.5">
      <animate
        attributeName="opacity"
        values="0;1;0"
        dur="0.7s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="78" cy="78" r="2">
      <animate
        attributeName="opacity"
        values="0;1;0"
        dur="0.9s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="73" cy="42" r="2">
      <animate
        attributeName="opacity"
        values="0;1;0"
        dur="0.6s"
        repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Alert badge -->
  <g>
    <circle cx="90" cy="88" r="16"
            fill="#dc2626"
            stroke="#fff"
            stroke-width="3">

      <animate
        attributeName="r"
        values="16;19;16"
        dur="1s"
        repeatCount="indefinite"/>
    </circle>

    <line x1="90" y1="78"
          x2="90" y2="89"
          stroke="white"
          stroke-width="4"
          stroke-linecap="round"/>

    <circle cx="90" cy="95" r="2.3"
            fill="white"/>
  </g>

</svg>