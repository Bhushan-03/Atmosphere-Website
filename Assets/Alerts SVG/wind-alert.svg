<svg width="120" height="120" viewBox="0 0 120 120"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="windGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="100" height="100"
        rx="22" fill="#eff6ff"/>

  <!-- Main strong wind -->
  <g fill="none"
     stroke="url(#windGradient)"
     stroke-width="6"
     stroke-linecap="round">

    <path d="M22 42 H78
             C92 42 92 28 80 28
             C74 28 71 32 71 36">

      <animate
        attributeName="d"
        values="
        M22 42 H78 C92 42 92 28 80 28 C74 28 71 32 71 36;
        M14 42 H70 C84 42 84 28 72 28 C66 28 63 32 63 36;
        M22 42 H78 C92 42 92 28 80 28 C74 28 71 32 71 36"
        dur="1.2s"
        repeatCount="indefinite"/>
    </path>

    <!-- Middle gust -->
    <path d="M18 60 H94">
      <animate
        attributeName="stroke-dasharray"
        values="20 8;45 8;20 8"
        dur="0.8s"
        repeatCount="indefinite"/>
    </path>

    <!-- Lower gust -->
    <path d="M30 78 H82
             C94 78 94 91 83 91
             C77 91 74 87 74 84">

      <animate
        attributeName="d"
        values="
        M30 78 H82 C94 78 94 91 83 91 C77 91 74 87 74 84;
        M20 78 H72 C84 78 84 91 73 91 C67 91 64 87 64 84;
        M30 78 H82 C94 78 94 91 83 91 C77 91 74 87 74 84"
        dur="1.4s"
        repeatCount="indefinite"/>
    </path>

  </g>

  <!-- Small speed lines -->
  <g stroke="#60a5fa" stroke-width="3" stroke-linecap="round">
    <line x1="28" y1="93" x2="48" y2="93">
      <animate attributeName="x1"
               values="28;18;28"
               dur="0.7s"
               repeatCount="indefinite"/>
    </line>

    <line x1="70" y1="52" x2="96" y2="52">
      <animate attributeName="x2"
               values="96;105;96"
               dur="0.6s"
               repeatCount="indefinite"/>
    </line>
  </g>

</svg>